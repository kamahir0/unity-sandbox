kind: table
table: rewards
typeName: RewardMaster

keys:
  primary:
    fields: [Id]
  secondary:
    - fields: [ItemId]
      unique: false
    - fields: [Quality]
      unique: false

fields:
  - name: Id
    type: int
    fixedIndex: 0
  - name: ItemId
    type: int
    fixedIndex: 1
  - name: Count
    type: int
    fixedIndex: 2
  - name: Guaranteed
    type: bool
    fixedIndex: 3
  - name: Quality
    type: ItemRarity
    fixedIndex: 4
  - name: BonusFeatures
    type: ItemFeature
    fixedIndex: 5
  - name: Multiplier
    type: double
    fixedIndex: 6
  - name: Note
    type: string
    fixedIndex: 7

refs:
  - name: Item
    target: ItemMaster
    targetKey:
      primary: true
    fields:
      - local: ItemId
        target: Id

rows:
  - data:
      Id: 1
      ItemId: 1001
      Count: 3
      Guaranteed: true
      Quality: Common
      BonusFeatures: Stackable
      Multiplier: 1.0
      Note: Potion bundle
  - data:
      Id: 2
      ItemId: 3001
      Count: 15
      Guaranteed: false
      Quality: Common
      BonusFeatures: Stackable, CraftingMaterial
      Multiplier: 1.25
      Note: Material bonus
  - data:
